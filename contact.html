<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — FreelanceFactory</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>

  <section class="section" style="padding-top:48px">
    <div class="container">
      <div class="section-header">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you</p>
      </div>
      <div class="grid-2" style="align-items:start">
        <div class="card card-body">
          <div id="alertArea"></div>
          <form id="contactForm">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Message</button>
          </form>
        </div>
        <div>
          <div class="card card-body mb-3">
            <h3 class="mb-3">Get in Touch</h3>
            <p>📧 <strong>Email:</strong> hello@freelancefactory.com</p>
            <p class="mt-2">📞 <strong>Phone:</strong> +977 1-4567890</p>
            <p class="mt-2">📍 <strong>Office:</strong> Thamel, Kathmandu, Nepal</p>
          </div>
          <div class="card card-body">
            <h4 class="mb-2">Follow Us</h4>
            <div class="social-links">
              <a href="#" title="LinkedIn">in</a>
              <a href="#" title="Facebook">f</a>
              <a href="#" title="Instagram">ig</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script>
    mountLayout(document.getElementById('header'), document.getElementById('footer'), { activePage: 'contact.html' });

    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      Store.addContactSubmission({
        id: generateId(),
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value,
        created_at: new Date().toISOString()
      });
      showAlert(document.getElementById('alertArea'), '✓ Thank you! Your message has been sent successfully. We\'ll get back to you soon.', 'success');
      e.target.reset();
    });
  </script>
</body>
</html>
