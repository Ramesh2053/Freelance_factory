<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — FreelanceFactory</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>
  <section class="section" style="padding-top:32px">
    <div class="container container-md">
      <h1 class="mb-4">Secure Payment</h1>
      <div id="alertArea"></div>
      <div class="card card-body mb-4" id="jobSummary"></div>
      <div class="card card-body text-center">
        <p class="text-muted">Amount to Pay</p>
        <div class="payment-amount" id="amount"></div>
        <p class="alert alert-info">🔒 Your payment is secure and held until work is approved</p>
        <h3 class="mb-3">Select Payment Method</h3>
        <div class="payment-methods">
          <label class="payment-method selected" id="khaltiMethod">
            <input type="radio" name="method" value="khalti" checked>
            <div style="font-size:24px">💜</div>
            <strong>Khalti</strong>
          </label>
          <label class="payment-method" id="esewaMethod">
            <input type="radio" name="method" value="esewa">
            <div style="font-size:24px">💚</div>
            <strong>eSewa</strong>
          </label>
        </div>
        <button class="btn btn-primary btn-lg" id="payBtn">Proceed to Payment</button>
      </div>
      <div class="card card-body mt-4">
        <h3 class="mb-3">Payment History</h3>
        <div id="history"></div>
      </div>
    </div>
  </section>
  <div id="footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script>
    if (!Auth.requireAuth()) throw '';
    if (!Auth.requireRole('client')) throw '';
    mountLayout(document.getElementById('header'), document.getElementById('footer'));

    const user = Auth.getCurrentUser();
    const jobId = getQueryParam('job');
    const freelancerId = getQueryParam('freelancer');
    const job = Store.getJob(jobId);
    const freelancer = Store.getUser(freelancerId);
    if (!job || !freelancer) { window.location.href = 'dashboard-client.html'; throw ''; }

    document.getElementById('jobSummary').innerHTML = `
      <h3>${job.title}</h3>
      <div class="flex gap-2 mt-2" style="align-items:center">
        <img src="${freelancer.profile_photo_url}" class="avatar" alt="">
        <div><strong>${freelancer.full_name}</strong><br><small class="text-muted">Freelancer</small></div>
      </div>
    `;
    document.getElementById('amount').textContent = formatCurrency(job.budget);

    document.querySelectorAll('.payment-method').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
      });
    });

    const history = Store.getPayments({ client_id: user.user_id });
    document.getElementById('history').innerHTML = history.length ? history.map(p => {
      const j = Store.getJob(p.job_id);
      return `<div class="flex-between mb-2" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div><strong>${j?.title || 'Job'}</strong><br><small>${formatDate(p.created_at)} · ${p.method}</small></div>
        <div><strong>${formatCurrency(p.amount)}</strong><br><span class="badge badge-${p.status === 'released' ? 'success' : p.status === 'frozen' ? 'danger' : 'warning'}">${p.status}</span></div>
      </div>`;
    }).join('') : '<p class="text-muted">No payment history</p>';

    document.getElementById('payBtn').addEventListener('click', () => {
      const method = document.querySelector('input[name="method"]:checked').value;
      const payment = {
        payment_id: generateId(),
        job_id: jobId,
        client_id: user.user_id,
        freelancer_id: freelancerId,
        amount: job.budget,
        method,
        status: 'escrow',
        created_at: new Date().toISOString()
      };
      Store.addPayment(payment);

      Store.addNotification({
        notification_id: generateId(),
        user_id: freelancerId,
        message: `${user.full_name} has secured payment for "${job.title}". You can now start work!`,
        read: false,
        created_at: new Date().toISOString()
      });

      Store.addActivity({
        activity_id: generateId(),
        user_id: user.user_id,
        type: 'payment',
        message: `Payment secured for "${job.title}"`,
        created_at: new Date().toISOString()
      });

      Store.addActivity({
        activity_id: generateId(),
        user_id: freelancerId,
        type: 'payment_received',
        message: `Payment secured for "${job.title}" — start work!`,
        created_at: new Date().toISOString()
      });

      sessionStorage.setItem('ff_last_payment', payment.payment_id);
      window.location.href = `escrow-confirmation.html?payment=${payment.payment_id}`;
    });
  </script>
</body>
</html>
