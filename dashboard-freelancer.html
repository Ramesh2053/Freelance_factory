<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Dashboard — FreelanceFactory</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>
  <div class="app-layout">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1 id="welcomeMsg">Welcome back!</h1>
        <p>Here's what's happening with your freelance work</p>
      </div>
      <div class="stat-cards" id="statCards"></div>
      <div class="flex gap-2 mb-4" style="flex-wrap:wrap">
        <a href="browse-jobs.html" class="btn btn-primary">Browse Jobs</a>
        <a href="profile-freelancer.html" id="profileLink" class="btn btn-outline">View Profile</a>
        <a href="messages.html" class="btn btn-ghost">Messages</a>
      </div>
      <div class="grid-2">
        <div class="card card-body">
          <h3 class="mb-3">Recent Activity</h3>
          <ul class="activity-list" id="activityList"></ul>
        </div>
        <div class="card card-body">
          <h3 class="mb-3">Upcoming Deadlines</h3>
          <div id="deadlines"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script>
    if (!Auth.requireAuth()) throw '';
    const user = Auth.getCurrentUser();
    if (!Auth.requireRole('freelancer')) throw '';
    mountLayout(document.getElementById('header'), null, { activePage: 'dashboard-freelancer.html' });
    document.getElementById('sidebar').innerHTML = renderSidebar('freelancer', 'dashboard-freelancer.html');

    const details = Store.getFreelancerDetails(user.user_id);
    const apps = Store.getApplications({ freelancer_id: user.user_id });
    const activeJobs = apps.filter(a => a.status === 'hired');
    const payments = Store.getPayments({ freelancer_id: user.user_id });
    const pendingEarnings = payments.filter(p => p.status === 'escrow').reduce((s, p) => s + p.amount, 0);
    const totalEarned = details?.total_earned || payments.filter(p => p.status === 'released').reduce((s, p) => s + p.amount, 0);

    document.getElementById('welcomeMsg').textContent = `Welcome back, ${user.full_name}!`;
    document.getElementById('profileLink').href = `profile-freelancer.html?id=${user.user_id}`;

    document.getElementById('statCards').innerHTML = `
      <div class="stat-card"><div class="stat-label">Active Projects</div><div class="stat-value">${activeJobs.length}</div><a href="browse-jobs.html" class="stat-link">View all →</a></div>
      <div class="stat-card"><div class="stat-label">Pending Earnings</div><div class="stat-value">${formatCurrency(pendingEarnings)}</div><span class="text-muted" style="font-size:13px">In escrow</span></div>
      <div class="stat-card"><div class="stat-label">Total Earned</div><div class="stat-value">${formatCurrency(totalEarned)}</div><span class="text-muted" style="font-size:13px">Lifetime</span></div>
      <div class="stat-card"><div class="stat-label">Average Rating</div><div class="stat-value">${details?.average_rating?.toFixed(1) || '0.0'}</div>${renderStars(details?.average_rating || 0)} <small>(${details?.total_reviews || 0} reviews)</small></div>
    `;

    const activities = Store.getActivities(user.user_id);
    document.getElementById('activityList').innerHTML = activities.length ? activities.slice(0, 5).map(a => `
      <li class="activity-item">
        <div class="activity-icon">📌</div>
        <div><p>${a.message}</p><span class="activity-time">${timeAgo(a.created_at)}</span></div>
      </li>
    `).join('') : '<li class="empty-state" style="padding:20px">No recent activity</li>';

    const hiredApps = apps.filter(a => a.status === 'hired');
    const deadlineJobs = hiredApps.map(a => Store.getJob(a.job_id)).filter(j => j && j.deadline);
    document.getElementById('deadlines').innerHTML = deadlineJobs.length ? deadlineJobs.map(j => `
      <div class="flex-between mb-2" style="padding:12px 0;border-bottom:1px solid var(--border)">
        <div><strong>${j.title}</strong><br><small class="text-muted">Due ${formatDate(j.deadline)}</small></div>
        <a href="work-submit.html?job=${j.job_id}" class="btn btn-sm btn-outline">Submit</a>
      </div>
    `).join('') : '<p class="text-muted">No upcoming deadlines</p>';
  </script>
</body>
</html>
